name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run example audit
        shell: bash
        run: PYTHONPATH=src python -m tableproof check --config examples/tableproof.toml --format json --output tableproof-report.json

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise local Action
        uses: ./
        with:
          config: examples/tableproof.toml
          report-dir: tableproof-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tableproof-reports
          path: tableproof-reports/
