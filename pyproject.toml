[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tableproof"
version = "0.1.0"
description = "Deterministic CSV/TSV join integrity audits for research data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TableProof contributors"}]
keywords = ["csv", "tsv", "data-quality", "joins", "research", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/suguangliang3083-jpg/tableproof"
Documentation = "https://github.com/suguangliang3083-jpg/tableproof#readme"
Issues = "https://github.com/suguangliang3083-jpg/tableproof/issues"
Source = "https://github.com/suguangliang3083-jpg/tableproof"

[project.scripts]
tableproof = "tableproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
